<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Viewer</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <style>
    /* General Styling */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #0f0f0f;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      background: linear-gradient(90deg, #6da63d, #A8D080);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }

    .navbar h1 {
      font-size: 1.8rem;
      color: #111;
    }

    .navbar .search-bar {
      display: flex;
      align-items: center;
    }

    .search-input {
      padding: 10px 15px;
      border: none;
      border-radius: 30px;
      width: 250px;
      background-color: #222;
      color: #fff;
      margin-right: 10px;
      outline: none;
    }

    .search-btn {
      background-color: #111;
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .search-btn:hover {
      background-color: #333;
      transform: scale(1.05);
    }

    /* Profile Section */
    .profile-container {
      max-width: 1200px;
      margin: 40px auto;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: flex-start;
      text-align: center;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 300px;
      background-color: #222;
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s ease;
    }

    .profile-header:hover {
      transform: translateY(-10px);
    }

    .profile-header img {
      border-radius: 50%;
      width: 150px;
      height: 150px;
      object-fit: cover;
      border: 3px solid #A8D080;
    }

    .profile-info h2 {
      font-size: 2rem;
      color: #A8D080;
      margin: 15px 0;
    }

    .profile-info p {
      color: #bbb;
      margin: 5px 0;
    }

    .stats {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      width: 100%;
      gap: 20px;
      flex-wrap: wrap;
    }

    .stat {
      background-color: #333;
      padding: 15px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 120px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .stat:hover {
      transform: scale(1.1);
    }

    .stat strong {
      color: #A8D080;
      display: block;
      font-size: 1.2rem;
    }

    /* Repositories Section */
    .repos-container {
      flex-grow: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .repo-card {
      background-color: #222;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .repo-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .repo-card h4 {
      color: #A8D080;
      margin-bottom: 10px;
    }

    .repo-card p {
      color: #bbb;
      flex-grow: 1;
    }

    .repo-card a {
      text-decoration: none;
      color: #A8D080;
      font-weight: 600;
      margin-top: 10px;
    }

    .repo-card a:hover {
      text-decoration: underline;
    }

    /* Loading Spinner */
    .spinner {
      border: 6px solid #222;
      border-top: 6px solid #A8D080;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
      display: none;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    /* Error Message */
    .error {
      color: #ff4d4d;
      font-size: 1.5rem;
      margin-top: 20px;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .profile-container {
        flex-direction: column;
        text-align: center;
        padding: 0 20px;
      }

      .repos-container {
        grid-template-columns: 1fr;
      }

      .stats {
        flex-direction: column;
        width: 100%;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h1>GitHub Viewer</h1>
    <div class="search-bar">
      <input type="text" id="username" class="search-input" placeholder="Enter GitHub username" value="Bushra-Butt-17">
      <button class="search-btn" onclick="fetchProfile()">Search</button>
    </div>
  </nav>

  <!-- Loading Spinner -->
  <div id="loading" class="spinner"></div>

  <!-- Profile Section -->
  <div id="profile" class="profile-container" style="display: none;">
    <div class="profile-header">
      <img id="avatar" src="" alt="Profile Picture">
      <div class="profile-info">
        <h2 id="name">Name</h2>
        <p id="bio">Bio</p>
        <div class="stats">
          <div class="stat">
            <strong id="followers">0</strong> Followers
          </div>
          <div class="stat">
            <strong id="following">0</strong> Following
          </div>
          <div class="stat">
            <strong id="repos-count">0</strong> Repositories
          </div>
          <div class="stat">
            <strong id="stars">0</strong> Stars
          </div>
        </div>
      </div>
    </div>

    <!-- Pinned Repositories
    <!-- Repositories Section -->
    <div id="repositories" class="repos-container" style="display: none;">
      <!-- Repository cards will be dynamically injected here by JavaScript -->
    </div>

    <!-- Error Section -->
    <div id="error" class="error" style="display: none;">
      Could not fetch user data. Please check the username and try again.
    </div>

  <script>
    // Fetch and Display Profile
    async function fetchProfile() {
      const username = document.getElementById('username').value.trim();
      if (!username) return alert('Please enter a GitHub username.');

      const profileContainer = document.getElementById('profile');
      const reposContainer = document.getElementById('repositories');
      const loadingSpinner = document.getElementById('loading');
      const errorContainer = document.getElementById('error');
      
      profileContainer.style.display = 'none';
      reposContainer.style.display = 'none';
      errorContainer.style.display = 'none';
      loadingSpinner.style.display = 'block';

      try {
        // Fetch user profile
        const userResponse = await fetch(`https://api.github.com/users/${username}`);
        if (!userResponse.ok) throw new Error('User not found');
        const userData = await userResponse.json();

        // Fetch user repositories
        const reposResponse = await fetch(userData.repos_url);
        if (!reposResponse.ok) throw new Error('Repositories not found');
        const reposData = await reposResponse.json();

        // Update profile UI
        document.getElementById('avatar').src = userData.avatar_url;
        document.getElementById('name').textContent = userData.name || userData.login;
        document.getElementById('bio').textContent = userData.bio || 'No bio available.';
        document.getElementById('followers').textContent = userData.followers;
        document.getElementById('following').textContent = userData.following;
        document.getElementById('repos-count').textContent = userData.public_repos;

        // Update repos UI
        reposContainer.innerHTML = '';
        reposData.forEach(repo => {
          const repoCard = document.createElement('div');
          repoCard.className = 'repo-card';
          repoCard.innerHTML = `
            <h4>${repo.name}</h4>
            <p>${repo.description || 'No description provided.'}</p>
            <a href="${repo.html_url}" target="_blank">View Repository</a>
          `;
          reposContainer.appendChild(repoCard);
        });

        profileContainer.style.display = 'flex';
        reposContainer.style.display = 'grid';
      } catch (error) {
        errorContainer.style.display = 'block';
        errorContainer.textContent = error.message;
      } finally {
        loadingSpinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
